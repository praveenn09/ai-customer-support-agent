services:
  postgres:
    image: postgres:16-alpine
    container_name: supportdesk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportdesk_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-supportdesk}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportdesk} -d ${POSTGRES_DB:-supportdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportdesk-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-supportdesk}:${POSTGRES_PASSWORD:-supportdesk_local_pass}@postgres:5432/${POSTGRES_DB:-supportdesk}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-local-secret-key}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      AUTO_REFUND_LIMIT_INR: ${AUTO_REFUND_LIMIT_INR:-5000}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: supportdesk-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
